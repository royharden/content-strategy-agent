[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "content-strategy-agent"
version = "0.1.0.dev0"
description = "Local metric-grounded review components; application integration pending."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["pydantic==2.14.1", "fastapi==0.143.1", "httpx==0.28.1", "uvicorn==0.54.0", "twitter-text-parser==3.0.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0", "PyYAML==6.0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/content_strategy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
extend-exclude = ["src/content_strategy/vendor/twitter_text", "conformance/vendor"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
