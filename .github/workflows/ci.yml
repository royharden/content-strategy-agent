name: Scaffold checks only
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python scaffold boundaries (not application evaluation)
        run: python -m unittest discover -s tests/scaffold -v
      - name: Frontend configuration boundaries (no listener or install)
        run: npm test
